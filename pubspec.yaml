name: genuiform
description: "Generative UI Forms for Flutter — adaptive, typed forms powered by Vertex AI Gemini."
version: 0.1.0-dev
homepage:

environment:
  sdk: ^3.5.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  http: ^1.6.0
  equatable: ^2.0.8
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.13.2
  build_runner: ^2.15.0
  mocktail: ^1.0.5

