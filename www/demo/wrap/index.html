<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>genuiform_demo</title>

  <!--
    This page is a thin iframe wrapper around the actual Flutter app at /app/.

    Why the wrapper exists:
    Flutter web release builds currently freeze the main render tree after
    first paint — setState / Stream rebuilds run but don't paint until
    *actual* `window.innerWidth` changes wake the platform-metrics path.
    From regular page JS you cannot programmatically change the top window's
    innerWidth (browsers block `window.resizeTo` for tabs).

    But an iframe's `window.innerWidth` *is* the iframe element's box. The
    parent page CAN resize the iframe element via CSS, and the iframe's
    inner window then sees a real metrics change. That re-arms the engine
    inside the iframe — same effect as the user manually resizing the
    browser, without the user needing to.

    Upstream issue: https://github.com/flutter/flutter/issues/186317
  -->

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #131218;
    }
    #app {
      border: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <iframe
    id="app"
    src="app/"
    title="genuiform workbench"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    (function () {
      const iframe = document.getElementById('app');

      // Toggle the iframe's box by 1px to force the inner window's
      // `innerWidth` to change. We alternate between 100% and calc(100% - 1px)
      // so successive kicks register as new sizes.
      let toggled = false;
      function kickOnce() {
        toggled = !toggled;
        iframe.style.width = toggled ? 'calc(100% - 1px)' : '100%';
      }

      function startHeartbeat() {
        // Stop pumping as soon as the user interacts with the iframe — at that
        // point the engine has work to do anyway, so it stays warm on its own.
        // Same-origin iframe, so we can listen on its window directly.
        let stopped = false;
        function stop() { stopped = true; }
        try {
          const win = iframe.contentWindow;
          const active = { once: true, capture: true };
          const passive = { once: true, capture: true, passive: true };
          win.addEventListener('mousedown', stop, active);
          win.addEventListener('keydown', stop, active);
          win.addEventListener('wheel', stop, passive);
          win.addEventListener('touchstart', stop, passive);
        } catch (e) {
          // Cross-origin (shouldn't happen here) — fall through to time-based stop.
        }

        // Hard cap at ~5 s. Covers cold-load engine init + first LLM
        // streaming response. If the user hasn't interacted by then, they've
        // either got a slow network or are just looking at the screen, and
        // the engine has had plenty of chances to settle.
        let ticks = 0;
        const id = setInterval(() => {
          ticks++;
          if (stopped || ticks > 50) { // 50 * 100ms = 5 s
            clearInterval(id);
            iframe.style.width = '100%';
            return;
          }
          kickOnce();
        }, 100);
      }

      if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
        startHeartbeat();
      } else {
        iframe.addEventListener('load', startHeartbeat, { once: true });
      }
    })();
  </script>
</body>
</html>
